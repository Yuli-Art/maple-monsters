<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>玩樂宇宙怪物屬性查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tracker.css">
</head>
<body>
<nav class="topnav" aria-label="分頁">
  <div class="topnav-in">
    <a class="brand" href="#monsters">玩樂宇宙<b>怪物屬性</b>查詢</a>
    <div class="navtabs">
      <a href="#monsters" data-view="monsters">怪物查詢</a>
      <a href="#chars" data-view="chars">我的角色</a>
      <a href="#routes" data-view="routes">練功路線</a>
      <a href="#skills" data-view="skills">技能配點</a>
      <a href="#gear" data-view="gear">裝備目標</a>
    </div>
  </div>
</nav>
<main id="view-monsters" class="view">
<div class="wrap">
  <header class="top">
    <span class="src" id="src"></span>
  </header>
  <div class="layout">
    <aside class="panel" aria-label="篩選條件">
      <div class="field">
        <span class="label">職業快選</span>
        <div class="row-btns" id="presets"></div>
      </div>
      <div class="field">
        <span class="label">屬性（可複選）</span>
        <div class="el-pick" id="elpick"></div>
      </div>
      <div class="field">
        <span class="label">條件</span>
        <div class="seg" id="mode">
          <button type="button" data-v="weak">弱點</button>
          <button type="button" data-v="safe">不抗</button>
          <button type="button" data-v="resist">抗性</button>
        </div>
        <p class="hint" id="modeHint"></p>
        <label class="check" id="strictWrap"><input type="checkbox" id="strict"> 同時抗任一選取屬性的不顯示</label>
      </div>
      <div class="field">
        <label class="label" for="item">想打的道具</label>
        <input type="search" id="item" list="itemList" placeholder="例如：雷電卷軸、黑色皮盾" autocomplete="off">
        <datalist id="itemList"></datalist>
      </div>
      <div class="field">
        <label class="label" for="q">怪物名稱</label>
        <input type="search" id="q" placeholder="中文或英文名" autocomplete="off">
      </div>
      <div class="field">
        <span class="label">怪物等級</span>
        <div class="two">
          <input type="number" id="lvMin" inputmode="numeric" min="1" max="200" placeholder="最低" aria-label="最低等級">
          <span>–</span>
          <input type="number" id="lvMax" inputmode="numeric" min="1" max="200" placeholder="最高" aria-label="最高等級">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label class="label" for="region">地區</label>
          <select id="region"><option value="">全部地區</option></select>
        </div>
        <div class="field">
          <label class="label" for="boss">BOSS</label>
          <select id="boss">
            <option value="all">全部</option>
            <option value="no">排除 BOSS</option>
            <option value="only">只看 BOSS</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="label" for="sort">排序</label>
        <select id="sort">
          <option value="lv">等級 低→高</option>
          <option value="lvd">等級 高→低</option>
          <option value="exp">經驗值 高→低</option>
          <option value="eff">經驗 / HP 高→低</option>
          <option value="hp">HP 低→高</option>
          <option value="drop">掉率 高→低（需輸入道具）</option>
        </select>
      </div>
      <button type="button" class="reset" id="reset">清除全部條件</button>
    </aside>

    <main class="results">
      <div class="summary" aria-live="polite">
        <span class="count" id="count"></span>
        <span class="desc" id="desc"></span>
      </div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>沒有符合的怪物。可以放寬等級範圍，或把條件從「弱點」改成「不抗」。</div>
      <p class="foot">弱＝受到該屬性傷害增加；抗＝傷害降低（網站資料沒有區分「減半」和「免疫」）。沒有標屬性的怪是無屬性，任何屬性都打正常傷害。點一下怪物可以看掉落表和出沒地圖，再點道具可以看裝備能力值和其他會掉這個道具的怪。</p>
    </main>
  </div>
</div>
</main>
<main id="view-chars" class="view tk" hidden><div class="wrap" id="chars"></div></main>
<main id="view-routes" class="view tk" hidden><div class="wrap" id="routes"></div></main>
<main id="view-skills" class="view tk" hidden><div class="wrap" id="skills"></div></main>
<main id="view-gear" class="view tk" hidden><div class="wrap" id="gear"></div></main>
<dialog class="item" id="itemDlg" aria-labelledby="dlgTitle"><div class="dlg" id="dlgBody"></div></dialog>
<dialog class="item pick" id="pickDlg"><form method="dialog" class="dlg" id="pickBody"></form></dialog>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="monsters.js"></script>
<script src="tracker.js"></script>
</body>
</html>
