<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"></head><body>
<title>玩樂宇宙怪物屬性查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：寬螢幕左側黏著篩選欄 + 右側怪物清單；窄螢幕上下堆疊。屬性色只用在屬性標籤上，介面主色是楓葉橘 */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E2E7EE; --fg:#192030; --muted:#586276; --line:#D2D9E3;
  --accent:#C9501A; --accent-fg:#FFFFFF; --accent-soft:#FBE4D7;
  --fire:#DE4728; --fire-ink:#FFFFFF; --fire-edge:#DE4728;
  --ice:#1C88C4; --ice-ink:#FFFFFF; --ice-edge:#1C88C4;
  --lightning:#F1C00C; --lightning-ink:#2B2206; --lightning-edge:#C99D00;
  --poison:#3C9135; --poison-ink:#FFFFFF; --poison-edge:#3C9135;
  --holy:#FFF0C0; --holy-ink:#5E450A; --holy-edge:#C59E38;
  --dark:#6544A4; --dark-ink:#FFFFFF; --dark-edge:#6544A4;
  --font-display:"Huninn","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141B; --surface:#181E28; --sunk:#212935; --fg:#E4E8F0; --muted:#97A1B4; --line:#2A3341;
    --accent:#F07434; --accent-fg:#1B0D05; --accent-soft:#3B2216;
    --holy:#4F4119; --holy-ink:#FCE7A4; --holy-edge:#C9A23E;
    --dark:#7454B6; --dark-edge:#9C7EDA; --ice-edge:#3FA6E0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141B; --surface:#181E28; --sunk:#212935; --fg:#E4E8F0; --muted:#97A1B4; --line:#2A3341;
  --accent:#F07434; --accent-fg:#1B0D05; --accent-soft:#3B2216;
  --holy:#4F4119; --holy-ink:#FCE7A4; --holy-edge:#C9A23E;
  --dark:#7454B6; --dark-edge:#9C7EDA; --ice-edge:#3FA6E0;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:16px}
h1{font-family:var(--font-display);font-weight:400;font-size:1.65rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 b{color:var(--accent);font-weight:400}
.src{color:var(--muted);font-size:.82rem}
.src a{color:inherit}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}

/* 篩選欄 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:860px){.panel{position:static;max-height:none}}
.field{display:grid;gap:6px;min-width:0}
.label{font-size:.75rem;color:var(--muted);letter-spacing:.08em;font-weight:500}
.row-btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.pill{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:.88rem}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.el-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.el-btn{font-family:var(--font-display);font-size:1.05rem;border-radius:8px;padding:6px 0;border:1.5px solid var(--c-edge);background:transparent;color:var(--fg)}
.el-btn[aria-pressed="true"]{background:var(--c);color:var(--c-ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 0;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
input[type=text],input[type=search],input[type=number],select{font:inherit;font-size:.92rem;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.two span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reset{justify-self:start;border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}

/* 結果 */
.results{min-width:0;display:grid;gap:10px;container:results / inline-size}
.summary{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:2px 2px 4px}
.summary .count{font-family:var(--font-display);font-size:1.25rem}
.summary .count b{color:var(--accent);font-weight:400}
.summary .desc{color:var(--muted);font-size:.88rem}
.list{display:grid;gap:6px}
.mob{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.mob.open{border-color:var(--accent)}
.mob .row{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:60px minmax(0,1fr) auto minmax(150px,190px);gap:4px 14px;align-items:center;padding:8px 12px}
.mob .row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--radius)}
.pic{width:60px;height:52px;display:grid;place-items:center}
.pic img{max-width:60px;max-height:52px;object-fit:contain}
.who{min-width:0;display:grid;gap:1px}
.nm{font-weight:700;font-size:1rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.boss{font-family:var(--font-display);font-weight:400;font-size:.72rem;background:var(--fg);color:var(--bg);border-radius:4px;padding:0 6px;letter-spacing:.06em}
.where{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nums{display:grid;grid-template-columns:52px 84px 72px;gap:10px;font-variant-numeric:tabular-nums;text-align:right}
.nums span{display:grid;line-height:1.25}
.nums small{font-size:.68rem;color:var(--muted);letter-spacing:.06em}
.nums .lv{font-weight:700}
.els{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-start}
.tag{font-size:.7rem;color:var(--muted);margin-right:-1px}
.tag + .chip{margin-left:0}
.els .gap{width:6px}
.chip{font-family:var(--font-display);font-size:.9rem;line-height:1;border-radius:6px;padding:4px 6px;border:1.5px solid var(--c-edge)}
.chip.w{background:var(--c);color:var(--c-ink)}
.chip.r{background:transparent;color:var(--fg);border-style:dashed}
.neutral{font-size:.8rem;color:var(--muted)}
.has-sel .chip{opacity:.38}
.sel-F .e-F,.sel-I .e-I,.sel-L .e-L,.sel-P .e-P,.sel-H .e-H,.sel-D .e-D{opacity:1}
.e-F{--c:var(--fire);--c-ink:var(--fire-ink);--c-edge:var(--fire-edge)}
.e-I{--c:var(--ice);--c-ink:var(--ice-ink);--c-edge:var(--ice-edge)}
.e-L{--c:var(--lightning);--c-ink:var(--lightning-ink);--c-edge:var(--lightning-edge)}
.e-P{--c:var(--poison);--c-ink:var(--poison-ink);--c-edge:var(--poison-edge)}
.e-H{--c:var(--holy);--c-ink:var(--holy-ink);--c-edge:var(--holy-edge)}
.e-D{--c:var(--dark);--c-ink:var(--dark-ink);--c-edge:var(--dark-edge)}
.hit{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 12px 8px 86px;font-size:.85rem;align-items:center}
.hit:empty{display:none}
.hit span{display:inline-flex;align-items:center;gap:4px}
.hit img{width:24px;height:24px;object-fit:contain}
.hit span b{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700;margin-left:2px}
.more{border-top:1px solid var(--line);padding:0 12px 14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -12px 12px;padding:0 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-size:.92rem;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent);font-weight:700}
.tabs .n{font-size:.75rem;color:var(--muted);margin-left:5px;font-weight:400;font-variant-numeric:tabular-nums}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.subs .pill{font-size:.8rem;padding:2px 10px}
.drops{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 18px}
.drops li{display:block}
.drop{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:3px 6px;border-radius:6px}
.drop:hover{background:var(--sunk)}
.drop:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.drops li.m .drop{background:var(--accent-soft)}
dialog.item{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(580px,calc(100% - 32px));max-height:min(86vh,780px);overflow:hidden}
dialog.item::backdrop{background:rgb(6 8 14 / .55)}
.dlg{display:grid;gap:16px;padding:16px;overflow:auto;max-height:min(86vh,780px)}
.dlg-head{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center}
.dlg-head .ico{width:56px;height:56px;border-radius:10px}
.dlg-head .ico img{max-width:44px;max-height:44px}
.dlg-head h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.3rem;line-height:1.3}
.dlg-head .t{color:var(--muted);font-size:.82rem}
.x{border:0;background:var(--sunk);border-radius:8px;width:34px;height:34px;font-size:1rem;color:var(--muted)}
.x:hover{color:var(--fg)}
.dlg h3{font-size:.75rem;color:var(--muted);letter-spacing:.08em;margin:0 0 6px;font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 24px}
.kv dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;font-weight:700}
.kv dd small{font-weight:400;color:var(--muted);margin-left:4px}
.note{font-size:.76rem;color:var(--muted);margin:6px 0 0}
.who-drops{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.who-drops li{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:4px 6px;border-radius:6px;font-size:.88rem}
.who-drops li.ok{background:var(--accent-soft)}
.who-drops .mi{width:40px;height:34px;display:grid;place-items:center}
.who-drops .mi img{max-width:40px;max-height:34px}
.who-drops .lvl{color:var(--muted);font-size:.78rem;margin-left:6px;font-variant-numeric:tabular-nums}
.who-drops .p{font-variant-numeric:tabular-nums;text-align:right;min-width:58px}
.dlg .els{gap:3px}
.dlg .chip{font-size:.8rem;padding:3px 5px}
@media (max-width:520px){
  .who-drops li{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"mi nm p" "mi el el"}
  .who-drops .mi{grid-area:mi}.who-drops .nm3{grid-area:nm}.who-drops .els{grid-area:el}.who-drops .p{grid-area:p}
}
.ico{width:38px;height:38px;display:grid;place-items:center;background:var(--sunk);border-radius:7px}
.ico img{max-width:32px;max-height:32px}
.drops .nm2{min-width:0;display:grid;line-height:1.3}
.drops .nm2 span:first-child{font-size:.88rem;overflow-wrap:anywhere}
.drops .t{color:var(--muted);font-size:.74rem}
.drops .p{font-variant-numeric:tabular-nums;text-align:right;font-size:.88rem}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 20px}
.maps h4{margin:0 0 4px;font-size:.82rem;color:var(--accent);font-weight:700}
.maps ul{list-style:none;margin:0;padding:0;display:grid;gap:1px;font-size:.86rem}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:8px 12px;display:grid;gap:2px;align-content:start}
.stat small{font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.stat b{font-variant-numeric:tabular-nums;font-size:1.05rem}
.stat .els{gap:4px}
.pane .hint{margin-top:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px 16px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:.8rem;margin-top:8px;max-width:70ch}
@container results (max-width:640px){
  .mob .row{grid-template-columns:56px minmax(0,1fr);grid-template-areas:"pic who" "pic nums" "pic els";padding:8px 10px;gap:4px 10px}
  .pic{grid-area:pic;width:56px;align-self:start}
  .who{grid-area:who}.nums{grid-area:nums;text-align:left;grid-template-columns:auto auto auto;justify-content:start;gap:14px}
  .nums span{display:flex;gap:4px;align-items:baseline}
  .els{grid-area:els}
  .hit{padding-left:76px}
  .more{padding:0 10px 12px}
  .tabs{margin:0 -10px 10px}
}
@media (prefers-reduced-motion:no-preference){.mob{transition:border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <h1>玩樂宇宙<b>怪物屬性</b>查詢</h1>
    <span class="src" id="src"></span>
  </header>
  <div class="layout">
    <aside class="panel" aria-label="篩選條件">
      <div class="field">
        <span class="label">職業快選</span>
        <div class="row-btns" id="presets"></div>
      </div>
      <div class="field">
        <span class="label">屬性（可複選）</span>
        <div class="el-pick" id="elpick"></div>
      </div>
      <div class="field">
        <span class="label">條件</span>
        <div class="seg" id="mode">
          <button type="button" data-v="weak">弱點</button>
          <button type="button" data-v="safe">不抗</button>
          <button type="button" data-v="resist">抗性</button>
        </div>
        <p class="hint" id="modeHint"></p>
        <label class="check" id="strictWrap"><input type="checkbox" id="strict"> 同時抗任一選取屬性的不顯示</label>
      </div>
      <div class="field">
        <label class="label" for="item">想打的道具</label>
        <input type="search" id="item" list="itemList" placeholder="例如：雷電卷軸、黑色皮盾" autocomplete="off">
        <datalist id="itemList"></datalist>
      </div>
      <div class="field">
        <label class="label" for="q">怪物名稱</label>
        <input type="search" id="q" placeholder="中文或英文名" autocomplete="off">
      </div>
      <div class="field">
        <span class="label">怪物等級</span>
        <div class="two">
          <input type="number" id="lvMin" inputmode="numeric" min="1" max="200" placeholder="最低" aria-label="最低等級">
          <span>–</span>
          <input type="number" id="lvMax" inputmode="numeric" min="1" max="200" placeholder="最高" aria-label="最高等級">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label class="label" for="region">地區</label>
          <select id="region"><option value="">全部地區</option></select>
        </div>
        <div class="field">
          <label class="label" for="boss">BOSS</label>
          <select id="boss">
            <option value="all">全部</option>
            <option value="no">排除 BOSS</option>
            <option value="only">只看 BOSS</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="label" for="sort">排序</label>
        <select id="sort">
          <option value="lv">等級 低→高</option>
          <option value="lvd">等級 高→低</option>
          <option value="exp">經驗值 高→低</option>
          <option value="eff">經驗 / HP 高→低</option>
          <option value="hp">HP 低→高</option>
          <option value="drop">掉率 高→低（需輸入道具）</option>
        </select>
      </div>
      <button type="button" class="reset" id="reset">清除全部條件</button>
    </aside>

    <main class="results">
      <div class="summary" aria-live="polite">
        <span class="count" id="count"></span>
        <span class="desc" id="desc"></span>
      </div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>沒有符合的怪物。可以放寬等級範圍，或把條件從「弱點」改成「不抗」。</div>
      <p class="foot">弱＝受到該屬性傷害增加；抗＝傷害降低（網站資料沒有區分「減半」和「免疫」）。沒有標屬性的怪是無屬性，任何屬性都打正常傷害。點一下怪物可以看掉落表和出沒地圖，再點道具可以看裝備能力值和其他會掉這個道具的怪。</p>
    </main>
  </div>
</div>
<dialog class="item" id="itemDlg" aria-labelledby="dlgTitle"><div class="dlg" id="dlgBody"></div></dialog>
<script src="data.js" charset="utf-8"></script>

<script>
const DATA = window.DATA;
const EL = [["F","火"],["I","冰"],["L","雷"],["P","毒"],["H","聖"],["D","暗"]];
const ELN = Object.fromEntries(EL);
const PRESETS = [["冰雷法師","IL"],["火毒法師","FP"],["僧侶・聖","H"]];
const GROUPS = ["裝備","卷軸","消耗","其他"];
const MODE_HINT = {
  weak: "至少弱其中一種選取的屬性。",
  safe: "選取的屬性都不會被抵抗（包含無屬性怪）。適合找「至少打得動」的怪。",
  resist: "至少抗其中一種選取的屬性，用來知道哪些怪要避開。"
};
const DEFAULTS = {els:"IL", mode:"weak", strict:false, lvMin:"", lvMax:"", q:"", item:"", region:"", boss:"all", sort:"lv"};
const KEY = "rm-mob-filter-v1";
let state = {...DEFAULTS};
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n.toLocaleString("en-US");
const pct = p => (p >= 1 ? +p.toFixed(1) : +p.toPrecision(2)) + "%";

const mobs = DATA.mobs;
const regionsOf = m => [...new Set(m.m.map(i => DATA.maps[i][1]))];
mobs.forEach(m => { m.rg = regionsOf(m); m.eff = m.hp ? m.exp / m.hp : 0; });

$("src").innerHTML = `資料來源 <a href="https://rebirth-maple.com/zh-tw/gameinfo/monsters" target="_blank" rel="noopener">rebirth-maple.com</a>・${mobs.length} 隻怪物・資料時間 ${esc((DATA.gen || "").slice(0, 10))}`;

// 控制項
$("presets").innerHTML = PRESETS.map(([n, e]) => `<button type="button" class="pill" data-els="${e}">${n}</button>`).join("");
$("elpick").innerHTML = EL.map(([c, n]) => `<button type="button" class="el-btn e-${c}" data-el="${c}" aria-label="${n}屬性">${n}</button>`).join("");
$("region").insertAdjacentHTML("beforeend", DATA.regions.map((r, i) => [r, i]).sort((a, b) => a[0].localeCompare(b[0], "zh-Hant")).map(([r, i]) => `<option value="${i}">${esc(r)}</option>`).join(""));
$("itemList").innerHTML = [...new Set(DATA.items.map(it => it[0]))].map(n => `<option value="${esc(n)}"></option>`).join("");

// 怪物列：每隻只建一次，篩選時只切換顯示與順序
function chips(str, kind) { return [...str].map(c => `<span class="chip ${kind} e-${c}">${ELN[c]}</span>`).join(""); }
function whereText(m) {
  if (!m.rg.length) return m.b ? "BOSS／特殊地圖" : "出沒地未登錄";
  const names = m.rg.map(i => DATA.regions[i]);
  return names.slice(0, 3).join("・") + (names.length > 3 ? ` 等 ${names.length} 區` : "");
}
const rows = new Map();
for (const m of mobs) {
  const el = document.createElement("article");
  el.className = "mob";
  const els = (m.w ? `<span class="tag">弱</span>${chips(m.w, "w")}` : "") +
              (m.w && m.r ? `<span class="gap"></span>` : "") +
              (m.r ? `<span class="tag">抗</span>${chips(m.r, "r")}` : "") ||
              `<span class="neutral">無屬性</span>`;
  el.innerHTML = `<button type="button" class="row" aria-expanded="false">
      <span class="pic">${m.img ? `<img src="${m.img}" alt="" width="60" height="52">` : ""}</span>
      <span class="who"><span class="nm">${esc(m.n)}${m.b ? `<span class="boss">BOSS</span>` : ""}</span><span class="where">${esc(whereText(m))}</span></span>
      <span class="nums"><span class="lv"><small>LV</small>${m.lv}</span><span><small>HP</small>${fmt(m.hp)}</span><span><small>EXP</small>${fmt(m.exp)}</span></span>
      <span class="els">${els}</span>
    </button><div class="hit"></div><div class="more" hidden></div>`;
  el.querySelector(".row").addEventListener("click", () => toggle(m, el));
  rows.set(m.id, el);
}

let lastTab = "drops";
const icon = i => DATA.items[i][5] ? `<img src="${DATA.items[i][5]}" alt="">` : "";
function toggle(m, el) {
  const more = el.querySelector(".more");
  const open = more.hidden;
  if (open && !more.dataset.built) {
    const tabs = [["drops", "掉落物", m.d.length], ["maps", "出沒地圖", m.m.length], ["info", "怪物資料", null]];
    more.innerHTML = `<div class="tabs" role="tablist">${tabs.map(([k, n, c]) =>
      `<button type="button" role="tab" data-tab="${k}">${n}${c != null ? `<span class="n">${c}</span>` : ""}</button>`).join("")}</div><div class="pane" role="tabpanel"></div>`;
    more.addEventListener("click", e => {
      const t = e.target.closest("[data-tab]"), s = e.target.closest("[data-sub]"), d = e.target.closest("[data-item]");
      if (d) openItem(+d.dataset.item);
      else if (t) showTab(m, more, t.dataset.tab);
      else if (s) showTab(m, more, "drops", +s.dataset.sub);
    });
    more.dataset.built = "1";
  }
  if (open) showTab(m, more, lastTab);
  more.hidden = !open;
  el.classList.toggle("open", open);
  el.querySelector(".row").setAttribute("aria-expanded", open);
}
function showTab(m, more, tab, sub = -1) {
  lastTab = tab;
  more.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  more.querySelector(".pane").innerHTML = tab === "drops" ? dropsPane(m, sub) : tab === "maps" ? mapsPane(m) : infoPane(m);
  markHits(m, more);
}
function dropsPane(m, sub) {
  if (!m.d.length) return `<p class="hint">網站沒有這隻怪的掉落資料。</p>`;
  const counts = [0, 0, 0, 0];
  m.d.forEach(([i]) => counts[DATA.items[i][2]]++);
  const subs = [[-1, "全部", m.d.length], ...GROUPS.map((g, k) => [k, g, counts[k]]).filter(x => x[2])];
  const list = m.d.filter(([i]) => sub < 0 || DATA.items[i][2] === sub);
  return `<div class="subs">${subs.map(([k, g, c]) => `<button type="button" class="pill" data-sub="${k}" aria-pressed="${k === sub}">${g} ${c}</button>`).join("")}</div>
    <ul class="drops">${list.map(([i, p]) => {
      const it = DATA.items[i];
      return `<li data-i="${i}"><button type="button" class="drop" data-item="${i}"><span class="ico">${icon(i)}</span><span class="nm2"><span>${esc(it[0])}</span><span class="t">${esc(it[1])}${it[3] ? `・Lv ${it[3]}` : ""}</span></span><span class="p">${pct(p)}</span></button></li>`;
    }).join("")}</ul>`;
}
function mapsPane(m) {
  if (!m.m.length) return `<p class="hint">網站沒有登錄這隻怪的出沒地圖${m.b ? "（BOSS 通常在特殊地圖召喚）" : ""}。</p>`;
  const byRegion = new Map();
  m.m.forEach(i => { const [name, r] = DATA.maps[i]; if (!byRegion.has(r)) byRegion.set(r, []); byRegion.get(r).push(name); });
  return `<div class="maps">${[...byRegion].map(([r, ns]) => `<div><h4>${esc(DATA.regions[r])}</h4><ul>${ns.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`).join("")}</div>`;
}
function infoPane(m) {
  const st = (k, v) => `<div class="stat"><small>${k}</small><b>${v}</b></div>`;
  return `<div class="statgrid">${st("等級", m.lv)}${st("HP", fmt(m.hp))}${st("經驗值", fmt(m.exp))}${st("攻擊", fmt(m.atk))}${st("經驗 / HP", m.eff.toFixed(3))}
    <div class="stat"><small>弱屬性</small><span class="els">${m.w ? chips(m.w, "w") : `<span class="neutral">無</span>`}</span></div>
    <div class="stat"><small>抗屬性</small><span class="els">${m.r ? chips(m.r, "r") : `<span class="neutral">無</span>`}</span></div>
    ${m.b ? st("類型", "BOSS") : ""}</div>`;
}
function markHits(m, more) {
  more.querySelectorAll("li[data-i]").forEach(li => li.classList.toggle("m", itemSet ? itemSet.has(+li.dataset.i) : false));
}

// 道具詳細資料視窗
const STAT = {wAtt:"物理攻擊", mAtt:"魔法攻擊", Str:"力量", Dex:"敏捷", Int:"智力", Luk:"幸運", Hp:"MaxHP", Mp:"MaxMP",
  Def:"物理防禦", MDef:"魔法防禦", Acc:"命中率", Eva:"迴避率", Speed:"移動速度", Jump:"跳躍力", AttSpeed:"攻擊速度",
  Knockback:"擊退機率", HpRecover:"HP 回復", MpRecover:"MP 回復", Duration:"持續時間", UpgradeCnt:"可升級次數"};
const REQ = {LEV:"等級", STR:"力量", DEX:"敏捷", INT:"智力", LUK:"幸運", POP:"名聲"};
const JOB = {Warrior:"劍士", Magician:"法師", Archer:"弓箭手", Thief:"盜賊", Pirate:"海盜", Mercedes:"精靈遊俠"};
const SPEED = {2:"極快", 3:"極快", 4:"快速", 5:"快速", 6:"普通", 7:"緩慢", 8:"緩慢", 9:"極慢"};
let droppers = null;
function statVal(k, v) {
  if (k === "AttSpeed") return `${SPEED[v] || ""}<small>(${v})</small>`;
  if (k === "Knockback") return v + "%";
  if (k === "Duration") return v >= 60 && v % 60 === 0 ? `${v / 60} 分鐘` : `${v} 秒`;
  if (Array.isArray(v)) { const [b, lo, hi] = v; return `${fmt(b)}${lo !== hi ? `<small>(${lo}–${hi})</small>` : ""}`; }
  return fmt(v);
}
function openItem(i) {
  if (!droppers) {
    droppers = DATA.items.map(() => []);
    mobs.forEach(m => m.d.forEach(([k, p]) => droppers[k].push([m, p])));
    droppers.forEach(l => l.sort((a, b) => b[1] - a[1] || a[0].lv - b[0].lv));
  }
  const [name, sub, grp, , , ico, stats, req, jobs, price] = DATA.items[i];
  const st = Object.keys(STAT).filter(k => stats && k in stats);
  const rq = Object.keys(REQ).filter(k => req && req[k]);
  const ranged = st.some(k => Array.isArray(stats[k]) && stats[k][1] !== stats[k][2]);
  const jobText = jobs && jobs.length ? jobs.map(j => JOB[j] || j).join("、") : grp === 0 ? "全職業" : "";
  const list = droppers[i];
  const ok = list.filter(([m]) => state.els && matchEl(m)).length;
  $("dlgBody").innerHTML = `
    <div class="dlg-head"><span class="ico">${ico ? `<img src="${ico}" alt="">` : ""}</span>
      <div><h2 id="dlgTitle">${esc(name)}</h2><div class="t">${esc(sub)}${jobText ? `・${jobText}` : ""}</div></div>
      <button type="button" class="x" data-close aria-label="關閉">✕</button></div>
    ${st.length || rq.length ? `<div class="kv">
      ${st.length ? `<div><h3>能力值</h3><dl>${st.map(k => `<dt>${STAT[k]}</dt><dd>${statVal(k, stats[k])}</dd>`).join("")}</dl>
        ${ranged ? `<p class="note">括號內是掉落時數值可能的浮動範圍。</p>` : ""}</div>` : ""}
      ${rq.length ? `<div><h3>穿戴需求</h3><dl>${rq.map(k => `<dt>${REQ[k]}</dt><dd>${fmt(req[k])}</dd>`).join("")}</dl></div>` : ""}
    </div>` : ""}
    ${price ? `<div class="stats">賣給商店：${fmt(price)} 楓幣</div>` : ""}
    <div><h3>掉落這個道具的怪物（${list.length}）</h3>
      ${ok ? `<p class="note" style="margin:0 0 6px">橘底的 ${ok} 隻符合你目前選的屬性條件。</p>` : ""}
      <ul class="who-drops ${state.els ? "has-sel " + [...state.els].map(c => "sel-" + c).join(" ") : ""}">${list.map(([m, p]) => `
        <li class="${state.els && matchEl(m) ? "ok" : ""}"><span class="mi">${m.img ? `<img src="${m.img}" alt="">` : ""}</span>
          <span class="nm3">${esc(m.n)}<span class="lvl">Lv ${m.lv}${m.b ? "・BOSS" : ""}</span></span>
          <span class="els">${m.w || m.r ? chips(m.w, "w") + chips(m.r, "r") : `<span class="neutral">無屬性</span>`}</span>
          <span class="p">${pct(p)}</span></li>`).join("")}</ul></div>`;
  const dlg = $("itemDlg");
  if (!dlg.open) dlg.showModal();
  $("dlgBody").scrollTop = 0;
}
$("itemDlg").addEventListener("click", e => { if (e.target === e.currentTarget || e.target.closest("[data-close]")) e.currentTarget.close(); });

// 篩選
let itemSet = null;
function buildItemSet() {
  const q = state.item.trim().toLowerCase();
  if (!q) { itemSet = null; return; }
  itemSet = new Set();
  DATA.items.forEach((it, i) => { if (it[0].toLowerCase().includes(q) || it[4].includes(q)) itemSet.add(i); });
}
function matchEl(m) {
  const S = [...state.els];
  if (!S.length) return true;
  const w = S.some(c => m.w.includes(c)), r = S.some(c => m.r.includes(c));
  if (state.mode === "weak") return w && !(state.strict && r);
  if (state.mode === "safe") return !r;
  return r;
}
function render() {
  const q = state.q.trim().toLowerCase();
  const lo = parseInt(state.lvMin) || 0, hi = parseInt(state.lvMax) || Infinity;
  const reg = state.region === "" ? -1 : +state.region;
  const out = [];
  for (const m of mobs) {
    if (m.lv < lo || m.lv > hi) continue;
    if (state.boss === "no" && m.b) continue;
    if (state.boss === "only" && !m.b) continue;
    if (reg >= 0 && !m.rg.includes(reg)) continue;
    if (q && !m.n.toLowerCase().includes(q) && !m.en.includes(q)) continue;
    if (!matchEl(m)) continue;
    let hits = null;
    if (itemSet) { hits = m.d.filter(([i]) => itemSet.has(i)); if (!hits.length) continue; }
    out.push([m, hits]);
  }
  const best = h => h && h.length ? Math.max(...h.map(x => x[1])) : -1;
  const cmp = {
    lv: (a, b) => a[0].lv - b[0].lv || a[0].id - b[0].id,
    lvd: (a, b) => b[0].lv - a[0].lv || a[0].id - b[0].id,
    exp: (a, b) => b[0].exp - a[0].exp,
    eff: (a, b) => b[0].eff - a[0].eff,
    hp: (a, b) => a[0].hp - b[0].hp,
    drop: (a, b) => best(b[1]) - best(a[1]) || a[0].lv - b[0].lv,
  }[state.sort] || ((a, b) => a[0].lv - b[0].lv);
  out.sort(cmp);

  const list = $("list");
  list.className = "list" + (state.els ? " has-sel " + [...state.els].map(c => "sel-" + c).join(" ") : "");
  const frag = document.createDocumentFragment();
  for (const [m, hits] of out) {
    const el = rows.get(m.id);
    el.querySelector(".hit").innerHTML = hits ? hits.slice(0, 6).map(([i, p]) => `<span>${icon(i)}${esc(DATA.items[i][0])}<b>${pct(p)}</b></span>`).join("") + (hits.length > 6 ? `<span>…另 ${hits.length - 6} 項</span>` : "") : "";
    const more = el.querySelector(".more");
    if (more.dataset.built) markHits(m, more);
    frag.appendChild(el);
  }
  list.replaceChildren(frag);
  $("empty").hidden = out.length > 0;
  $("count").innerHTML = `<b>${out.length}</b> / ${mobs.length} 隻`;
  $("desc").textContent = describe();
}
function describe() {
  const parts = [];
  if (state.els) {
    const names = [...state.els].map(c => ELN[c]);
    parts.push(state.mode === "weak" ? "弱" + names.join("或弱") + (state.strict ? "（排除有抗性的）" : "")
      : state.mode === "safe" ? "不抗" + names.join("、") : "抗" + names.join("或抗"));
  }
  if (state.lvMin || state.lvMax) parts.push(`Lv ${state.lvMin || 1}–${state.lvMax || "∞"}`);
  if (state.region !== "") parts.push(DATA.regions[+state.region]);
  if (state.item.trim()) parts.push(`掉「${state.item.trim()}」`);
  if (state.boss === "no") parts.push("不含 BOSS"); else if (state.boss === "only") parts.push("只有 BOSS");
  return parts.join("・");
}

// 同步控制項狀態
function syncControls() {
  document.querySelectorAll("#elpick .el-btn").forEach(b => b.setAttribute("aria-pressed", state.els.includes(b.dataset.el)));
  document.querySelectorAll("#presets .pill").forEach(b => b.setAttribute("aria-pressed", [...b.dataset.els].sort().join("") === [...state.els].sort().join("")));
  document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.mode));
  $("modeHint").textContent = state.els ? MODE_HINT[state.mode] : "沒有選屬性時會列出全部怪物。";
  $("strictWrap").hidden = !(state.mode === "weak" && state.els.length > 1);
  $("strict").checked = state.strict;
  for (const k of ["item", "q", "lvMin", "lvMax", "region", "boss", "sort"]) if ($(k).value !== String(state[k])) $(k).value = state[k];
}
function update(patch) {
  Object.assign(state, patch);
  if ("item" in patch) buildItemSet();
  if (state.sort === "drop" && !state.item.trim()) state.sort = "lv";
  save(); syncControls(); render();
}

$("presets").addEventListener("click", e => { const b = e.target.closest("[data-els]"); if (b) update({els: b.dataset.els, mode: "weak"}); });
$("elpick").addEventListener("click", e => {
  const b = e.target.closest("[data-el]"); if (!b) return;
  const c = b.dataset.el;
  update({els: state.els.includes(c) ? state.els.replace(c, "") : EL.map(x => x[0]).filter(x => state.els.includes(x) || x === c).join("")});
});
$("mode").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) update({mode: b.dataset.v}); });
$("strict").addEventListener("change", e => update({strict: e.target.checked}));
for (const k of ["item", "q", "lvMin", "lvMax"]) $(k).addEventListener("input", e => update({[k]: e.target.value}));
for (const k of ["region", "boss", "sort"]) $(k).addEventListener("change", e => update({[k]: e.target.value}));
$("reset").addEventListener("click", () => update({...DEFAULTS, els: ""}));

buildItemSet(); syncControls(); render();
</script>

</body></html>
